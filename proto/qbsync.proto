syntax = "proto3";

package qbsync;

option go_package = "github.com/arsac/qb-sync/proto";

// QBSyncService handles torrent synchronization between source and destination.
// Destination qBittorrent is the single source of truth for sync status.
// InitTorrent determines what needs syncing by checking qB, active syncs, and filesystem.
service QBSyncService {
  // StreamPiecesBidi provides full-duplex streaming for maximum throughput.
  // Client streams pieces, server streams back acknowledgments as pieces are written.
  // This allows immediate retry on failure without waiting for batch completion.
  rpc StreamPiecesBidi(stream WritePieceRequest) returns (stream PieceAck);

  // InitTorrent initializes or resumes a torrent sync.
  // This is the primary entry point - it checks:
  // 1. If torrent is already complete in destination qBittorrent -> COMPLETE
  // 2. If sync is in progress -> returns remaining pieces_needed
  // 3. If files exist on disk -> triggers qB verification, returns verified pieces
  // 4. Fresh torrent -> all pieces needed
  // This RPC is idempotent - safe to call multiple times.
  rpc InitTorrent(InitTorrentRequest) returns (InitTorrentResponse);

  // FinalizeTorrent completes torrent transfer: renames partial files,
  // adds to local qBittorrent, triggers recheck, and waits for verification.
  rpc FinalizeTorrent(FinalizeTorrentRequest) returns (FinalizeTorrentResponse);

  // AbortTorrent aborts an in-progress torrent transfer and cleans up partial files.
  // Called when a torrent is removed from source before streaming completes.
  rpc AbortTorrent(AbortTorrentRequest) returns (AbortTorrentResponse);

  // StartTorrent resumes a stopped torrent on destination qBittorrent.
  // Called by source during disk pressure cleanup after stopping the torrent on source,
  // ensuring destination takes over seeding before source deletes the torrent.
  rpc StartTorrent(StartTorrentRequest) returns (StartTorrentResponse);

  // CheckArrRejections asks the destination whether Sonarr/Radarr rejected each
  // torrent, so the source can skip syncing it.
  //
  // The lookup runs on the destination because that is where the *arr instances
  // live. A history response can carry a hundred records; relaying returns one
  // verdict per torrent instead, and reuses the connection already streaming
  // pieces rather than opening an HTTP call across the link.
  //
  // Fail-open by contract: every error path, on either side, yields sync=true.
  // The filter is an optimisation, and refusing to sync because *arr is
  // unreachable would be worse than syncing something unwanted.
  rpc CheckArrRejections(CheckArrRejectionsRequest) returns (CheckArrRejectionsResponse);
}

// PieceErrorCode categorizes piece-level failures for retry decisions.
enum PieceErrorCode {
  PIECE_ERROR_NONE = 0;            // Default / unknown (backward-compatible with old destination)
  PIECE_ERROR_IO = 1;              // Disk I/O, permission, disk full
  PIECE_ERROR_HASH_MISMATCH = 2;   // SHA1 verification failed
  PIECE_ERROR_NOT_INITIALIZED = 3; // Torrent not tracked on destination
  PIECE_ERROR_FINALIZING = 4;      // Torrent is being finalized
}

// FinalizeErrorCode categorizes finalization failures for retry decisions.
enum FinalizeErrorCode {
  FINALIZE_ERROR_NONE = 0;       // Default / unknown
  FINALIZE_ERROR_INCOMPLETE = 1; // Not all pieces written
  FINALIZE_ERROR_NOT_FOUND = 2;  // Torrent state not found or stale (data files missing)
  FINALIZE_ERROR_BUSY = 3;       // Destination congested (finalize queue timeout, or qB still checking at budget expiry); retry without penalty
}

message WritePieceRequest {
  string torrent_hash = 1;
  int32 piece_index = 2;
  int64 offset = 3;
  int64 size = 4;
  reserved 5;             // formerly piece_hash; destination now uses InitTorrentRequest.piece_hashes
  reserved "piece_hash";
  bytes data = 6;
}

// PieceAck is sent by the receiver for each piece in bidirectional streaming.
message PieceAck {
  string torrent_hash = 1;
  int32 piece_index = 2;
  bool success = 3;
  string error = 4;
  PieceErrorCode error_code = 5;  // Structured error code for retry decisions
}

message InitTorrentRequest {
  string torrent_hash = 1;
  string name = 2;
  int64 piece_size = 3;
  int64 total_size = 4;
  int32 num_pieces = 5;
  repeated FileInfo files = 6;
  bytes torrent_file = 7;           // Raw .torrent file for resume state and verification
  repeated string piece_hashes = 8; // SHA1 hashes per piece (hex-encoded)
  string save_sub_path = 9;         // Relative sub-path prefix for file storage (e.g., "movies" from category)
  bool resync = 10;                 // Force re-initialization after file selection change
}

message FileInfo {
  string path = 1;
  int64 size = 2;
  int64 offset = 3;
  uint64 inode = 4;  // Source filesystem inode for hardlink detection
  bool selected = 5; // True if file is selected for download (priority > 0)
  uint64 device = 6; // Source filesystem device ID for cross-device detection
}

// TorrentSyncStatus indicates the current state of a torrent on destination.
enum TorrentSyncStatus {
  // READY: Torrent initialized, stream pieces where pieces_needed[i] is true.
  // If all pieces_needed are false, just call FinalizeTorrent.
  SYNC_STATUS_READY = 0;

  // COMPLETE: Torrent already exists in destination qBittorrent and is verified.
  // No action needed - source can delete this torrent if space is needed.
  SYNC_STATUS_COMPLETE = 1;

  // VERIFYING: Files exist on disk, qBittorrent recheck is in progress.
  // Source should wait and retry InitTorrent after a delay.
  SYNC_STATUS_VERIFYING = 2;
}

message InitTorrentResponse {
  bool success = 1;
  string error = 2;

  // Status indicates what action source should take
  TorrentSyncStatus status = 3;

  // pieces_needed[i] = true means piece i needs to be streamed.
  // Only populated when status is SYNC_STATUS_READY.
  // Empty if status is SYNC_STATUS_COMPLETE or SYNC_STATUS_VERIFYING.
  repeated bool pieces_needed = 4;

  // Hardlink results - which files were hardlinked (for logging/debugging)
  repeated HardlinkResult hardlink_results = 5;

  // Count of pieces that need streaming (derived from pieces_needed).
  // Special value -1 means torrent not yet initialized on destination
  // (i.e., a minimal CheckTorrentStatus call — caller should send full InitTorrent).
  // Must stay in sync with pieces_needed when status is SYNC_STATUS_READY.
  int32 pieces_needed_count = 6;

  // Count of pieces already present (hardlinked, verified, or previously received)
  int32 pieces_have_count = 7;
}

// HardlinkResult describes the result of hardlink detection for a single file.
message HardlinkResult {
  int32 file_index = 1;        // Index in files array
  bool hardlinked = 2;         // Whether hardlink was created
  string source_path = 3;      // Path of existing file used (if hardlinked)
  string error = 4;            // Error message if hardlink failed
  bool pending = 5;            // Waiting for another torrent to finish this file
  bool pre_existing = 6;       // File already existed on disk with correct size
}

message FinalizeTorrentRequest {
  string torrent_hash = 1;
  string save_path = 2;    // Destination path for qBittorrent
  string category = 3;     // Optional category
  string tags = 4;         // Optional tags (comma-separated)
  string save_sub_path = 5; // Relative sub-path prefix for file storage (e.g., "movies" from category)
  bool save_sub_path_explicit = 6; // True when save_sub_path is explicitly set (distinguishes "" from unset for backwards compat)
}

message FinalizeTorrentResponse {
  bool success = 1;
  string error = 2;
  string state = 3;                  // Final qBittorrent state
  FinalizeErrorCode error_code = 4;  // Structured error code for retry decisions
}

message AbortTorrentRequest {
  string torrent_hash = 1;
  bool delete_files = 2;   // If true, delete partial files; if false, just stop tracking
}

message AbortTorrentResponse {
  bool success = 1;
  string error = 2;
  int32 files_deleted = 3; // Number of partial files deleted
}

message StartTorrentRequest {
  string torrent_hash = 1;
  string tag = 2;  // Optional tag to apply after starting (e.g., "source-removed")
}

message StartTorrentResponse {
  bool success = 1;
  string error = 2;
}

// Piece is a lightweight reference to a piece (no data).
// Used for internal signaling/queueing between source components.
message Piece {
  string torrent_hash = 1;
  int32 index = 2;
  int64 offset = 3;
  int64 size = 4;
  string hash = 5;  // SHA1 hash for verification
}

// ArrCheckItem identifies one torrent to check.
message ArrCheckItem {
  string torrent_hash = 1;
  // qBittorrent category. The destination owns category-to-instance routing, so
  // the source passes the raw category and never needs to know which *arr
  // instance, if any, claims it.
  string category = 2;
}

message CheckArrRejectionsRequest {
  repeated ArrCheckItem items = 1;
}

message ArrVerdict {
  string torrent_hash = 1;
  bool sync = 2;
  // Reason is an open set carried as a string rather than an enum, so adding a
  // new one does not require both sides to upgrade in lockstep. The fail-open
  // contract never depends on recognising the value.
  string reason = 3;
  // Instance that decided ("radarr", "sonarr"), empty when the category routes
  // to neither. The source uses it only to label metrics.
  string instance = 4;
}

message CheckArrRejectionsResponse {
  // FilterEnabled is false when the destination has no *arr configured. That is
  // a configuration state rather than an error, and it lets the source stop
  // asking without needing a second flag of its own.
  bool filter_enabled = 1;
  // Verdicts are index-aligned with the request items.
  repeated ArrVerdict verdicts = 2;
  // Categories currently routed to an *arr instance, discovered from the
  // instances themselves rather than configured. The source uses this to skip
  // asking about torrents no *arr owns, which is most of them on a typical
  // library. A request with no items is a cheap way to fetch just this.
  repeated string categories = 3;
}
